name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # What the checks are written against. Raise these on purpose, so a new
  # compiler's lints never fail a change that has nothing to do with them.
  RUST_TOOLCHAIN: "1.97"
  NODE_VERSION: "26"

jobs:
  backend:
    name: Backend and API client
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # No debug information: nothing here runs under a debugger, and leaving
      # it out shortens the build and shrinks the cache.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The same two connections as .env.example.
      DATABASE_URL: postgres://exchange_app:exchange_app@127.0.0.1:5432/exchange
      MIGRATION_DATABASE_URL: postgres://exchange:exchange@127.0.0.1:5432/exchange
    services:
      # The same database as docker-compose.yml. As the container's own user,
      # `exchange` is a superuser here, so it may create the throwaway
      # databases the API tests use.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange
        ports:
          - 5432:5432
        # Over TCP, which answers only once initialization has finished.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U exchange -d exchange"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      # For the API client generator, the last step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A service container starts before the checkout, so it cannot mount the
      # init script the way docker-compose.yml does.
      - name: Create the application role
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U exchange -d exchange < docker/postgres-init.sql

      # Each check below runs even when an earlier one has failed, so one run
      # reports everything that is wrong.
      - name: Format
        if: ${{ !cancelled() }}
        working-directory: backend
        run: cargo fmt --check

      - name: Clippy
        if: ${{ !cancelled() }}
        working-directory: backend
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        working-directory: backend
        run: cargo test --locked --no-fail-fast

      # Here rather than in the TypeScript job because the generator runs the
      # service's `openapi` binary, which the tests have just built.
      - name: Generated API client is up to date
        if: ${{ !cancelled() }}
        run: |
          npm run gen:api
          if [ -n "$(git status --porcelain -- packages/api-client)" ]; then
            git diff -- packages/api-client
            echo "::error::packages/api-client does not match the service. Run 'npm run gen:api' and commit the result."
            exit 1
          fi

  typescript:
    name: TypeScript
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and wording check
        run: npm run typecheck

      - name: Lint the web app
        if: ${{ !cancelled() }}
        run: npm run lint -w @exchange/web

      - name: Lint the mobile app
        if: ${{ !cancelled() }}
        run: npm run lint -w @exchange/mobile -- --max-warnings 0

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build the web app
        if: ${{ !cancelled() }}
        run: npm run build:web

  # Builds the image the Dockerfile describes and runs the whole stack from
  # docker-compose.yml, as a deployment would: the database, the migrations,
  # the API serving the web app, and the worker. Its own job, beside the two
  # above, so a slow image build never holds up their results.
  container:
    name: Container image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          # The name docker-compose.yml uses, so it runs this build.
          tags: exchange-platform:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: docker image inspect exchange-platform:local --format 'exchange-platform:local is {{.Size}} bytes'

      - name: Start the stack
        run: docker compose --profile full up --no-build --detach

      # The API answers once the migrations have run and it has started; the
      # web app's entry page comes from the build inside the image.
      - name: Smoke check
        run: |
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/healthz; then break; fi
            sleep 2
          done
          check() {
            local expected="$1"; shift
            local actual
            actual="$(curl --silent --output /dev/null --write-out "$@")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::expected $expected, got $actual for: $*"
              exit 1
            fi
          }
          check '204' '%{http_code}' http://127.0.0.1:8080/healthz
          check '204' '%{http_code}' http://127.0.0.1:8080/readyz
          check '200 text/html' '%{http_code} %{content_type}' http://127.0.0.1:8080/
          check '200 application/json' '%{http_code} %{content_type}' http://127.0.0.1:8080/v1/meta
          check '200 text/html' '%{http_code} %{content_type}' http://127.0.0.1:8080/exchanges/some-id
          check '404' '%{http_code}' http://127.0.0.1:8080/v1/nothing
          curl --silent --fail http://127.0.0.1:8080/es/i | grep --quiet 'lang="es"'
          curl --silent --fail http://127.0.0.1:8080/en/i | grep --quiet 'lang="en"'
          curl --silent --fail --head http://127.0.0.1:8080/ | grep --ignore-case --quiet '^x-frame-options: DENY'
          curl --silent --fail --head http://127.0.0.1:8080/ | grep --ignore-case --quiet '^cache-control: no-cache'
          asset="$(curl --silent --fail http://127.0.0.1:8080/ | grep --only-matching '/assets/[^"]*\.js' | head -1)"
          test -n "$asset"
          curl --silent --fail --head "http://127.0.0.1:8080$asset" | grep --ignore-case --quiet '^cache-control: public, max-age=31536000, immutable'

      - name: Worker runs and stops cleanly on a signal
        run: |
          sleep 5
          docker compose --profile full logs worker | grep --quiet 'worker started'
          docker compose --profile full stop --timeout 20 worker
          docker compose --profile full logs worker | grep --quiet 'worker shutting down'
          code="$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose --profile full ps --all --quiet worker)")"
          test "$code" = "0" || { echo "::error::the worker exited with $code"; exit 1; }

      - name: Logs
        if: ${{ failure() }}
        run: docker compose --profile full logs

  # The web app in a real browser, against the real API and a real database:
  # two people, each in a browser of their own, taking exchanges through
  # their lifecycle (apps/web/e2e). One-time codes are read from the API's
  # log, so no mail server is involved.
  e2e:
    name: End to end
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      DATABASE_URL: postgres://exchange_app:exchange_app@127.0.0.1:5432/exchange
      MIGRATION_DATABASE_URL: postgres://exchange:exchange@127.0.0.1:5432/exchange
      APP_SECRET: ci-only-secret-for-the-end-to-end-tests-0123456789
      # Where the API started below writes its log; the tests read codes from it.
      E2E_API_LOG: ${{ github.workspace }}/apps/web/e2e/.output/api.log
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U exchange -d exchange"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Create the application role
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U exchange -d exchange < docker/postgres-init.sql

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Build the backend
        working-directory: backend
        run: cargo build --locked --bin api --bin migrate

      - name: Build the web app
        run: npm run build:web

      - name: Apply the migrations
        run: backend/target/debug/migrate

      # The address and settings the tests expect (apps/web/e2e/support/env.ts).
      - name: Start the API
        env:
          BIND_ADDR: 127.0.0.1:8090
          WEB_ORIGIN: http://127.0.0.1:8090
          WEB_DIR: ${{ github.workspace }}/apps/web/dist
          CODE_DELIVERY: log
          NOTIFICATION_DELIVERY: log
          NO_COLOR: "1"
          # Each simulated person sends an address of their own here, so the
          # per-address sign-in limits count them apart.
          TRUSTED_PROXY_HEADER: X-Forwarded-For
        run: |
          mkdir -p "$(dirname "$E2E_API_LOG")"
          nohup backend/target/debug/api > "$E2E_API_LOG" 2>&1 &
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8090/readyz; then exit 0; fi
            sleep 1
          done
          cat "$E2E_API_LOG"
          echo "::error::the API did not become ready"
          exit 1

      - name: Run the tests
        run: npm run e2e -w @exchange/web

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e/.output
          retention-days: 14
