[package]
name = "exchange-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
getrandom = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
uuid = { version = "1.26.1", features = ["v4"] }

# The macOS 27 toolchain can strip a proc-macro dylib into one the loader
# rejects ("mis-aligned LINKEDIT string pool"), which fails the build of
# whichever crate uses the macro. Leave build-time crates unstripped.
[profile.dev.build-override]
strip = "none"

[profile.release.build-override]
strip = "none"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
