[package]
name = "yuppers-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
hmac = "0.13.0"
# HTTPS to the push and SMS providers (`crate::outbound`). hyper and
# hyper-util are already here for axum, and rustls with ring and the webpki
# roots for lettre and sqlx, so the only new crate is the connector between
# them: one TLS library and one root store for every connection the service
# makes. reqwest 0.13 has no `rustls-tls` feature any more; its `rustls`
# feature brings aws-lc-rs, a second crypto provider built from C.
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-roots"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.9"
# SMTP over the tokio runtime with rustls, so the image needs no OpenSSL. No
# connection pool: a notification is rare, and a fresh connection per send is
# one less thing to keep healthy.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

# The macOS 27 toolchain can strip a proc-macro dylib into one the loader
# rejects ("mis-aligned LINKEDIT string pool"), which fails the build of
# whichever crate uses the macro. Leave build-time crates unstripped.
[profile.dev.build-override]
strip = "none"

[profile.release.build-override]
strip = "none"

[dev-dependencies]
# Reads back what the test SMTP server received.
mail-parser = "0.11.9"
tower = { version = "0.5.3", features = ["util"] }
